<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lasthavens</title>
<meta name="description" content="Lasthavens is a Wrath of the Lich King (3.3.5) realm you play right in your browser. No download, no launcher: create an account on the login screen and play.">
<link rel="canonical" href="https://lasthavens.com/">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<meta name="theme-color" content="#d9a826">
<!-- Link previews (Discord, social sites). og-image.jpg is made on the server by make-logo.py. -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="Lasthavens">
<meta property="og:url" content="https://lasthavens.com/">
<meta property="og:title" content="Lasthavens: Wrath of the Lich King in your browser">
<meta property="og:description" content="A Wrath of the Lich King (3.3.5) realm you play right in your browser. No download, no launcher.">
<meta property="og:image" content="https://lasthavens.com/og-image.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Lasthavens, a Wrath of the Lich King realm you play in your browser">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Lasthavens: Wrath of the Lich King in your browser">
<meta name="twitter:description" content="A Wrath of the Lich King (3.3.5) realm you play right in your browser. No download, no launcher.">
<meta name="twitter:image" content="https://lasthavens.com/og-image.jpg">
<style>
    html, body { margin: 0; height: 100%; background: #000; color: #ccc; font: 12px/1.4 monospace; overflow: hidden; }
    #canvas { display: block; width: 100vw; height: 100vh; outline: none; }
    #log { position: fixed; left: 0; right: 0; bottom: 0; max-height: 35vh; overflow: auto; margin: 0; padding: 6px 8px;
           background: rgba(0, 0, 0, .75); white-space: pre-wrap; pointer-events: none; z-index: 2; }
    #log.hidden { display: none; }

    /* The client's own loading screen (LoadingScreen.cpp): a painting letterboxed to 4:3 or 16:10, the bar border
       0.6 x 0.05 of it centred 0.075 up from the bottom, the fill 0.525 x 0.025 growing from the left. The textures
       are extracted from the game data on the server (extract-art.mjs). */
    #loading { position: fixed; inset: 0; z-index: 1; background: #000; display: flex; align-items: center;
               justify-content: center; transition: opacity .25s; }
    #loading.done { opacity: 0; pointer-events: none; }
    #screen { position: relative; width: min(100vw, calc(100vh * var(--ratio, 1.6)));
              aspect-ratio: var(--ratio, 1.6); background: center / 100% 100% no-repeat; }
    #fill, #border { position: absolute; background: left / 100% 100% no-repeat; }
    #fill { left: 23.75%; bottom: 6.25%; width: 0; height: 2.5%; background-image: url("loading-bar-fill.png"); }
    #border { left: 20%; bottom: 5%; width: 60%; height: 5%; background-image: url("loading-bar-border.png"); }
    #status { position: absolute; left: 0; right: 0; bottom: 12%; text-align: center; color: #ffd200;
              font: 15px Georgia, serif; text-shadow: 1px 1px 0 #000; }

    /* Shown while game data downloads after the login screen; in the client's gold with its text shadow. */
    #activity { position: fixed; left: 0; right: 0; bottom: 20%; z-index: 1; text-align: center; pointer-events: none;
                color: #ffd200; font: 16px Georgia, serif; text-shadow: 1px 1px 0 #000, 0 0 6px #000;
                opacity: 0; transition: opacity .3s; }
    #activity.on { opacity: 1; }
    #activity span::after { content: ""; animation: dots 1.2s steps(4) infinite; }
    @keyframes dots { 0% { content: ""; } 25% { content: "."; } 50% { content: ".."; } 75% { content: "..."; } }

    /* Without extracted art (a local bridge): the same bar, drawn plainly. */
    #loading.plain #border { border: 1px solid #555; box-sizing: border-box; background: none; }
    #loading.plain #fill { background: #2d6f8f; }
</style>
</head>
<body>
<canvas id="canvas" tabindex="0" oncontextmenu="event.preventDefault()"></canvas>
<div id="loading">
    <div id="screen"><div id="fill"></div><div id="border"></div><div id="status"></div></div>
</div>
<div id="activity">Downloading game data<span></span></div>
<pre id="log" class="hidden"></pre>
<script>
    const log = document.getElementById("log");
    const append = (text) => {
        log.textContent += text + "\n";
        log.scrollTop = log.scrollHeight;
        console.log(text);
    };
    // The log starts hidden; F10 toggles it.
    addEventListener("keydown", (e) => { if (e.key === "F10") { log.classList.toggle("hidden"); e.preventDefault(); } });

    // Alt+Enter and the login screen's Fullscreen button (Input.cpp, WebAccount.cpp). In fullscreen, Esc goes to the game
    // (Keyboard Lock, where supported) so it still closes menus; holding it leaves fullscreen.
    window.wowToggleFullscreen = () => {
        if (document.fullscreenElement) {
            document.exitFullscreen().catch(() => {});
            return;
        }
        document.documentElement.requestFullscreen({ navigationUI: "hide" })
            .then(() => navigator.keyboard?.lock?.(["Escape"]))
            .catch(() => {});
    };

    const loading = document.getElementById("loading");
    const screen = document.getElementById("screen");
    const fill = document.getElementById("fill");
    const status = document.getElementById("status");

    // A random painting, as the client picks one per zone.
    fetch("loading-art.json").then((r) => (r.ok ? r.json() : Promise.reject())).then(({ screens }) => {
        const pick = screens[Math.floor(Math.random() * screens.length)];
        screen.style.setProperty("--ratio", pick.wide ? 1.6 : 4 / 3);
        screen.style.backgroundImage = `url("${pick.file}")`;
    }).catch(() => loading.classList.add("plain"));

    // The client reads game data one 1 MB block at a time with synchronous requests (WebVfs.cpp), ~0.2 s each on a first
    // visit. Fetching the blocks it reads on its way to the login screen (login-blocks.txt) a few at a time while Wow.wasm
    // downloads puts them in the browser cache before it asks. Same URLs as WebVfsFetchBlock, so the cache entries match.
    // More at once only slows Wow.wasm: a first visit is bandwidth-bound by then. A stale list costs bandwidth, not
    // correctness. To re-record it, empty it, load the page in a fresh browser profile against
    // `bridge.mjs --trace > trace.log` (with the deployment's WTF/Config.wtf: without SET movie "0" the intro
    // cinematic is read too), then: grep -o '^GET /blocks/[^ ]*' trace.log | cut -c13- | awk '!seen[$0]++'
    // world-blocks.txt follows, fetched while the player sits on the login screen: the blocks entering the world reads
    // in any starting zone (interface textures, UI sounds, generic world art; recorded as a dwarf in Coldridge and an orc
    // in Durotar, kept where both read them), clicks' blocks first. Without them the first open of the character pane,
    // spellbook or world map froze the game for 0.2-0.8 s while the disk queue fetched its textures one 1 MB block at a
    // time. To re-record it, empty both lists, record as above for two characters of different starting zones (log in,
    // enter the world, open the common windows), and keep the blocks both traces share that login-blocks.txt lacks.
    Promise.all(["login-blocks.txt", "world-blocks.txt"].map((f) => fetch(f).then((r) => (r.ok ? r.text() : "")).catch(() => ""))).then((texts) => {
        const urls = texts.join("\n").split("\n").filter(Boolean).map((p) => "/blocks/" + p.split("/").map(encodeURIComponent).join("/"));
        const next = async () => {
            for (let url; (url = urls.shift()); ) await fetch(url).then((r) => r.arrayBuffer()).catch(() => {});
        };
        for (let i = 0; i < 6; i++) next();
    });

    // Progress: the download is the first 70%; startup creeps on until the client reports the login screen is up.
    let progress = 0;
    const setProgress = (p) => { progress = Math.max(progress, Math.min(p, 1)); fill.style.width = `${progress * 52.5}%`; };
    let creep;

    // Anonymous usage counts for the admin page (admin.mjs): the event, a browser family or failure reason, and the load
    // time. Nothing identifying is sent.
    const report = (event, detail = "", ms = 0) => fetch("/stats/event", {
        method: "POST", keepalive: true, headers: { "Content-Type": "application/json" }, body: JSON.stringify({ event, detail, ms }),
    }).catch(() => {});
    const ua = navigator.userAgent;
    report("visit", /Edg\//.test(ua) ? "edge" : /Firefox\//.test(ua) ? "firefox" : /Chrome\//.test(ua) ? "chrome" : /Safari\//.test(ua) ? "safari" : "other");

    let failed = false;
    const fail = (text, reason = "other") => {
        clearInterval(creep);
        status.textContent = text;
        if (!failed) report("load_failed", reason);
        failed = true;
    };
    if (!document.createElement("canvas").getContext("webgl2")) {
        fail("Your browser can't run the game (it needs WebGL 2). Try a recent Chrome, Edge or Firefox on a computer.", "webgl2");
    }

    // The client reports when its glue frames are loaded and hands over window.wowFetchCount(), the number of game-data
    // blocks it has fetched (WebAccount.cpp). The login scene still streams in after that, so the loading screen stays
    // up until the count has not moved for 1.5 s; the cap keeps a slow connection from showing it forever. After that,
    // a download that runs for more than a moment (entering the world, a new zone) gets the activity line, because the
    // game itself stops drawing while it waits for data.
    const activity = document.getElementById("activity");
    let loaded = false;
    const finishLoading = (capped) => {
        if (loaded) return;
        loaded = true;
        clearInterval(creep);
        setProgress(1);
        setTimeout(() => loading.classList.add("done"), 200);
        if (!capped) report("loaded", "", performance.now());
    };
    setTimeout(() => finishLoading(true), 180_000);
    window.wowFramesLoaded = () => {
        let last = window.wowFetchCount(), changedAt = performance.now(), burstFrom = null;
        setInterval(() => {
            const count = window.wowFetchCount(), now = performance.now();
            if (count !== last) {
                if (burstFrom === null) burstFrom = { at: now, count: last };
                last = count;
                changedAt = now;
                if (!loaded) setProgress(progress + (0.99 - progress) * 0.03);
            } else if (now - changedAt >= 1500) {
                burstFrom = null;
                finishLoading(false);
            }
            const showing = loaded && burstFrom !== null && now - burstFrom.at >= 700;
            activity.classList.toggle("on", showing);
            if (showing) activity.firstChild.textContent = `Downloading game data (${count - burstFrom.count} MB)`;
        }, 250);
    };

    if (!crossOriginIsolated) {
        fail("This page has to be served by the Lasthavens bridge.", "isolation");
    }

    var Module = {
        canvas: document.getElementById("canvas"),
        print: append,
        printErr: append,

        // Downloads Wow.wasm with progress (the browser keeps it, so later visits only check it is current).
        instantiateWasm(info, receive) {
            (async () => {
                const response = await fetch("Wow.wasm");
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                // The CDN compresses it, so the bridge also sends the real size.
                const total = Number(response.headers.get("x-file-size") ?? 0)
                    || (response.headers.get("content-encoding") ? 0 : Number(response.headers.get("content-length") ?? 0));
                const reader = response.body.getReader();
                const chunks = [];
                let received = 0;
                for (;;) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    chunks.push(value);
                    received += value.length;
                    if (total) setProgress((received / total) * 0.7);
                }
                const bytes = new Uint8Array(received);
                let at = 0;
                for (const chunk of chunks) { bytes.set(chunk, at); at += chunk.length; }

                setProgress(0.7);
                creep = setInterval(() => setProgress(progress + (0.97 - progress) * 0.015), 100);
                const { instance, module } = await WebAssembly.instantiate(bytes, info);
                receive(instance, module);
            })().catch((e) => fail(`Could not load the game (${e.message}). Reload the page to try again.`, "download"));
            return {};
        },
    };
    window.addEventListener("error", (e) => { if (!loading.classList.contains("done")) fail(e.message); });
</script>
<script src="Wow.js"></script>
</body>
</html>
