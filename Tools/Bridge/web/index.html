<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>World of Warcraft (wowdecomp)</title>
<style>
    html, body { margin: 0; height: 100%; background: #000; color: #ccc; font: 12px/1.4 monospace; overflow: hidden; }
    #canvas { display: block; width: 100vw; height: 100vh; outline: none; }
    #log { position: fixed; left: 0; right: 0; bottom: 0; max-height: 35vh; overflow: auto; margin: 0; padding: 6px 8px;
           background: rgba(0, 0, 0, .75); white-space: pre-wrap; pointer-events: none; }
    #log.hidden { display: none; }
</style>
</head>
<body>
<canvas id="canvas" tabindex="0" oncontextmenu="event.preventDefault()"></canvas>
<pre id="log"></pre>
<script>
    const log = document.getElementById("log");
    const append = (text) => {
        log.textContent += text + "\n";
        log.scrollTop = log.scrollHeight;
        console.log(text);
    };
    // F10 toggles the log.
    addEventListener("keydown", (e) => { if (e.key === "F10") { log.classList.toggle("hidden"); e.preventDefault(); } });

    if (!crossOriginIsolated) {
        append("Page is not cross-origin isolated; serve it with Tools/Bridge/bridge.mjs.");
    }

    var Module = {
        canvas: document.getElementById("canvas"),
        print: append,
        printErr: append,
    };
</script>
<script src="Wow.js"></script>
</body>
</html>
